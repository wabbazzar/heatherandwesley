<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heather & Wesley</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #333;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    .tagline {
      font-size: 1.1rem;
      color: #777;
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      color: #555;
      text-decoration: none;
      font-size: 0.95rem;
      padding: 0.5rem 1rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      transition: border-color 0.2s, color 0.2s;
    }
    .links a:hover {
      border-color: #999;
      color: #111;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Heather & Wesley</h1>
    <p class="tagline">Austin, TX</p>
    <div class="links">
      <a href="/archive/">Our Wedding &mdash; Maui 2025</a>
      <a href="https://bopthere.com">BopThere</a>
    </div>
  </div>
</body>
</html>
